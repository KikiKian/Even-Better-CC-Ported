<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nothing to see here... :D</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

<iframe 
  src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&loop=1&playlist=dQw4w9WgXcQ"
  allow="autoplay; fullscreen">
</iframe>

<script>
  // Unmute after user interaction (required by most browsers)
  document.addEventListener("click", () => {
    const iframe = document.querySelector("iframe");
    iframe.src = iframe.src.replace("mute=1", "mute=0");
  });
</script>

</body>
</html>
